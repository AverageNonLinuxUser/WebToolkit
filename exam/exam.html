<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exam — Local Practice Exam App</title>
<meta name="theme-color" content="#0c0d1e" />
<meta name="description" content="Practice exams with timer, scoring and history — runs entirely in your browser." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Practice Exam" />
<link rel="manifest" href="../manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="../icons/icon.svg" />
<link rel="apple-touch-icon" href="../icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<header class="app-header">
  <div class="brand">📝 Local Exam <span>Practice</span></div>
  <nav id="main-nav">
    <a href="index.html" data-page="select" class="nav-btn">Select Exam</a>
    <a href="history.html" data-page="history" class="nav-btn">Score History</a>
    <a href="../index.html" class="nav-btn toolkit">← Toolkit</a>
  </nav>
</header>

<main id="app">
  <div class="exam-topbar">
    <div><span id="exam-title-label"></span> <span id="mode-badge" class="badge"></span></div>
    <div class="topbar-mid">
      <div class="progress"><div id="progress-fill"></div></div>
      <small id="progress-label"></small>
    </div>
    <div id="timer" class="timer">00:00</div>
    <button id="btn-toggle-nav" class="btn ghost">☰</button>
    <button id="btn-submit" class="btn primary">Submit</button>
  </div>
  <div class="exam-layout">
    <aside id="navigator" class="navigator"></aside>
    <div class="card question-card">
      <span id="q-topic" class="badge"></span>
      <span id="q-count" class="muted"></span>
      <h2 id="q-text"></h2>
      <div id="q-options"></div>
      <div id="q-explain" class="explanation hidden"></div>
      <div class="row">
        <button id="btn-flag" class="btn ghost">⚑ Flag for review</button>
        <button id="btn-check" class="btn ghost hidden">Check Answer</button>
        <div class="spacer"></div>
        <button id="btn-prev" class="btn ghost">← Prev</button>
        <button id="btn-next" class="btn ghost">Next →</button>
      </div>
    </div>
  </div>
</main>

<footer class="muted small center">Single-user local app · data stored in browser localStorage · no server needed</footer>
<script type="module" src="js/exam.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('../sw.js'); });
}
</script>
</body>
</html>
